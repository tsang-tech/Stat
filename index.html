<script>
    // 智能解析邏輯：將上方原始文字自動轉換成 HTML 表格
    const rawData = document.getElementById('raw-data').textContent;
    let tabs = [];
    let currentTab = -1;
    let currentGroup = -1;
    let currentEvent = -1;

    const lines = rawData.split('\n').map(l => l.trim()).filter(l => l !== '');
    
    lines.forEach(line => {
        if (line.includes("2025-2026 年度沙田區小學校際") || line.includes("保良局屬下小學第二十屆") || line.includes("保良局屬下沙田區小學")) {
            let shortName = line;
            if(line.includes("沙田區小學校際")) shortName = "沙田區小學校際";
            else if(line.includes("第二十屆聯合運動會")) shortName = "保良局小學聯運會";
            else if(line.includes("沙田區小學聯合運動會")) shortName = "保良局沙田區聯運會";
            
            tabs.push({ title: line, shortTitle: shortName, groups: [] });
            currentTab++;
            currentGroup = -1;
        } else if (line.includes("組")) {
            tabs[currentTab].groups.push({ title: line, events: [] });
            currentGroup++;
            currentEvent = -1;
        } else if (/^\d+米|跳高|跳遠|擲壘球|推鉛球|壘球|鉛球|4 x 100/.test(line)) {
            tabs[currentTab].groups[currentGroup].events.push({ title: line, results: [] });
            currentEvent++;
        } else if (/^\d+\./.test(line)) {
            let rank, name, score;
            let dashIndex = line.lastIndexOf(' - ');
            if (dashIndex !== -1) {
                let dotIndex = line.indexOf('.');
                rank = line.substring(0, dotIndex).trim();
                name = line.substring(dotIndex + 1, dashIndex).trim();
                score = line.substring(dashIndex + 3).trim();
            } else {
                let dotIndex = line.indexOf('.');
                rank = line.substring(0, dotIndex).trim();
                name = line.substring(dotIndex + 1).trim();
                score = "-";
            }
            tabs[currentTab].groups[currentGroup].events[currentEvent].results.push({rank, name, score});
        }
    });

    // 渲染 HTML
    let tabsHtml = '';
    let contentHtml = '';

    tabs.forEach((tab, tIdx) => {
        let activeClass = tIdx === 0 ? 'active' : '';
        tabsHtml += `<button class="tab-btn ${activeClass}" onclick="openTab(event, 'tab${tIdx}')">${tab.shortTitle}</button>`;

        contentHtml += `<div id="tab${tIdx}" class="tab-content ${activeClass}">
            <h2 style="color:#2c3e50; text-align:center;">${tab.title}</h2>`;

        tab.groups.forEach(group => {
            contentHtml += `<div class="group-title">${group.title}</div>`;

            group.events.forEach(ev => {
                let eventTitle = ev.title;
                let recordHtml = '';
                if(eventTitle.includes('(')) {
                    let parts = eventTitle.split('(');
                    eventTitle = parts[0].trim();
                    recordHtml = `<span class="record">(${parts[1]}</span>`;
                }

                contentHtml += `
                <div class="event-section">
                    <div class="event-title">${eventTitle} ${recordHtml}</div>
                    <table>
                        <tr><th class="rank-col">名次</th><th>姓名 (學校)</th><th>成績</th></tr>`;

                ev.results.forEach(res => {
                    let scoreClass = res.score.includes('*') ? 'class="new-record"' : '';
                    contentHtml += `<tr><td class="rank-col">${res.rank}</td><td>${res.name}</td><td ${scoreClass}>${res.score}</td></tr>`;
                });

                contentHtml += `</table></div>`;
            });
        });
        contentHtml += `</div>`;
    });

    document.getElementById('tabs-container').innerHTML = tabsHtml;
    document.getElementById('content-container').innerHTML = contentHtml;

    // 分頁切換功能
    window.openTab = function(evt, tabName) {
        let tabcontent = document.getElementsByClassName("tab-content");
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        let tablinks = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        document.getElementById(tabName).style.display = "block";
        // setTimeout for animation re-trigger
        setTimeout(() => document.getElementById(tabName).classList.add("active"), 10);
        evt.currentTarget.classList.add("active");
    }
</script>

</body>
</html>
